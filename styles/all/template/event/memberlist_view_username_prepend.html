{% if AWS_ICONS %}
	<span class="profile-cards" style="display: inline-block; vertical-align: middle; margin-right: 5px;">
		{% for icon in AWS_ICONS %}
			<i class="fa {{ icon.ICON }}" style="color: {{ icon.COLOR }}; vertical-align: middle; margin-right: 2px;" title="{{ lang('WARNING') }}"></i>
		{% endfor %}
	</span>
{% endif %}
