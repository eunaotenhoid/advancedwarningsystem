    eunaumtenhoid.advancedwarningsystem.controller.mcp_aws_appeals:
        class: eunaumtenhoid\advancedwarningsystem\controller\mcp\mcp_aws_appeals
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@dbal.tools'
            - '@auth'
            - '@template'
            - '@user'
            - '@request'
            - '@log'
            - '@cache.driver'
            - '@service_container'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%core.table_prefix%'
            - '%eunaumtenhoid.advancedwarningsystem.tables.warning_rules%'

    # UCP AWS Controllers
    eunaumtenhoid.advancedwarningsystem.controller.ucp_aws_warning_list:
        class: eunaumtenhoid\advancedwarningsystem\controller\ucp\ucp_aws_warning_list
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@dbal.tools'
            - '@template'
            - '@user'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%core.table_prefix%'
            - '%eunaumtenhoid.advancedwarningsystem.tables.warning_rules%'

    eunaumtenhoid.advancedwarningsystem.controller.ucp_aws_appeal:
        class: eunaumtenhoid\advancedwarningsystem\controller\ucp\ucp_aws_appeal
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@dbal.tools'
            - '@template'
